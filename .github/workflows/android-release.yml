name: Unified Release (Windows & Android)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v6.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: unified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create or update GitHub Release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="${DISPATCH_TAG}"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Could not determine release tag"
            exit 1
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          NOTES_FILE="docs/release/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Updating existing release metadata for ${RELEASE_TAG}"
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$RELEASE_TAG" --title "MathCanvas ${RELEASE_TAG}" --notes-file "$NOTES_FILE"
            fi
          else
            echo "Creating GitHub Release ${RELEASE_TAG}"
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$RELEASE_TAG" --title "MathCanvas ${RELEASE_TAG}" --notes-file "$NOTES_FILE"
            else
              gh release create "$RELEASE_TAG" --title "MathCanvas ${RELEASE_TAG}" --generate-notes
            fi
          fi

  windows-release-bundle:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          key: windows-release-x64
      - name: Build Windows x64 Desktop Installers (NSIS, MSI, Portable)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run bundle --workspace @draw/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect Windows Release Artifacts & Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -Raw "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $outDir = "artifacts/windows-release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $nsis = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $msi = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          $portableSrc = "apps/desktop/src-tauri/target/release/mathcanvas-desktop.exe"
          if (-not $nsis) { throw "NSIS installer not found" }
          if (-not $msi) { throw "MSI installer not found" }
          if (-not (Test-Path $portableSrc)) { throw "Portable executable not found" }

          $nsisDest = Join-Path $outDir "MathCanvas_${version}_x64-setup.exe"
          $msiDest = Join-Path $outDir "MathCanvas_${version}_x64_en-US.msi"
          $portableDest = Join-Path $outDir "MathCanvas_${version}_x64.exe"
          Copy-Item -Path $nsis.FullName -Destination $nsisDest -Force
          Copy-Item -Path $msi.FullName -Destination $msiDest -Force
          Copy-Item -Path $portableSrc -Destination $portableDest -Force

          $files = @($nsisDest, $portableDest, $msiDest)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $sumsPath = Join-Path $outDir "SHA256SUMS-windows.txt"
          [System.IO.File]::WriteAllText($sumsPath, ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content $sumsPath
          Get-ChildItem $outDir | Select-Object Name, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mathcanvas-windows-release-bundle
          path: artifacts/windows-release/
          retention-days: 30
      - name: Upload Windows Assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $assets = Get-ChildItem -Path "artifacts/windows-release" -File | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  android-release-apk:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
          key: android-release-aarch64
      - name: Configure Java, Android SDK, and NDK environment
        run: |
          JAVA17="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_VER="$(ls -1 "$SDK/ndk" | grep -E '^(27|28)\.' | sort -V | tail -n 1 || true)"
          if [ -z "$NDK_VER" ]; then
            NDK_VER="$(ls -1 "$SDK/ndk" | sort -V | tail -n 1)"
          fi
          NDK="$SDK/ndk/$NDK_VER"
          LLVM_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "$JAVA17/bin" >> "$GITHUB_PATH"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$LLVM_BIN/llvm-ranlib" >> "$GITHUB_ENV"
      - name: Initialize Tauri Android project and apply MathCanvas patches
        run: |
          npm run build --workspace @draw/web
          npm run android:init --workspace @draw/desktop
      - name: Build Android ARM64 Release APK
        run: |
          set -o pipefail
          npm run android:build --workspace @draw/desktop 2>&1 | tee android-release-build.log
      - name: Align, sign, verify, and checksum Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-release
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("apps/desktop/src-tauri/tauri.conf.json","utf8")).version')"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          BUILD_TOOLS_VER="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VER"
          RAW_APK="$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          if [ -z "$RAW_APK" ]; then
            echo "::error::No APK produced by tauri android build"
            exit 1
          fi
          OUT_APK="artifacts/android-release/MathCanvas-${VERSION}-android-arm64.apk"
          if [[ "$RAW_APK" == *-unsigned.apk ]]; then
            KEYSTORE="/tmp/mathcanvas-release.keystore"
            if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
              echo "Signing with repository release keystore secret"
              printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
              KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
              KEY_ALIAS="${ANDROID_KEY_ALIAS}"
              KEY_PASS="${ANDROID_KEY_PASSWORD:-$KS_PASS}"
            else
              echo "No ANDROID_KEYSTORE_BASE64 secret configured; signing with CI release-compat keystore"
              KS_PASS="android"
              KEY_ALIAS="mathcanvas"
              KEY_PASS="android"
              "$JAVA_HOME/bin/keytool" -genkeypair -v -keystore "$KEYSTORE" -storepass "$KS_PASS" \
                -alias "$KEY_ALIAS" -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=MathCanvas Release,O=MathCanvas,C=CN"
            fi
            ALIGNED="/tmp/mathcanvas-aligned.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:${KS_PASS}" \
              --key-pass "pass:${KEY_PASS}" \
              --out "$OUT_APK" \
              "$ALIGNED"
            rm -f "$ALIGNED" "$KEYSTORE"
          else
            cp -v "$RAW_APK" "$OUT_APK"
          fi
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT_APK"
          (
            cd artifacts/android-release
            sha256sum "MathCanvas-${VERSION}-android-arm64.apk" > SHA256SUMS-android.txt
          )
          cat artifacts/android-release/SHA256SUMS-android.txt
          ls -lh artifacts/android-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mathcanvas-android-release-apk
          path: artifacts/android-release/
          retention-days: 30
      - name: Upload Android Assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          APK_FILE="artifacts/android-release/MathCanvas-${APP_VERSION}-android-arm64.apk"
          SUMS_FILE="artifacts/android-release/SHA256SUMS-android.txt"
          gh release upload "$RELEASE_TAG" "$APK_FILE" "$SUMS_FILE" --clobber

  publish-release:
    needs: [prepare-release, windows-release-bundle, android-release-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (a re-tagged release is left as a draft)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest
